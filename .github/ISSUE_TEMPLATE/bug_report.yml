name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the problem and expected behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Give the smallest set of steps that reproduces the problem.
    validations:
      required: true
  - type: input
    attributes:
      label: Version
      description: Project release or commit.
    validations:
      required: false
