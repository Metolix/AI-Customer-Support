[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-customer-support"
version = "1.0.0"
description = "Embeddable AI customer support powered by Groq and FastAPI."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sidhak Singh" }]
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "groq",
  "python-dotenv",
  "pydantic",
  "slowapi",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
